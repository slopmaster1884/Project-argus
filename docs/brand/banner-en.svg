<line x1="1050" y1="185" x2="880" y2="290" stroke="#2f6b4c" stroke-width="2"/>
<line class="flow" x1="1050" y1="185" x2="880" y2="290" stroke="#3ddc84" stroke-width="2.4" style="animation-delay:-0.6s" filter="url(#glow2)"/>
<line x1="1050" y1="185" x2="1200" y2="295" stroke="#2f6b4c" stroke-width="2"/>
<line class="flow" x1="1050" y1="185" x2="1200" y2="295" stroke="#3ddc84" stroke-width="2.4" style="animation-delay:-0.9s" filter="url(#glow2)"/>
