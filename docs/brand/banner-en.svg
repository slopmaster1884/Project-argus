<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050c09"/><stop offset=".6" stop-color="#0a1812"/><stop offset="1" stop-color="#06110c"/></linearGradient>
<radialGradient id="halo" cx=".79" cy=".5" r=".45"><stop offset="0" stop-color="#3ddc84" stop-opacity=".28"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eafff3"/><stop offset=".5" stop-color="#7dffb6"/><stop offset="1" stop-color="#3ddc84"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc84" stop-opacity="0"/><stop offset=".5" stop-color="#3ddc84" stop-opacity=".18"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1f3a2d" stroke-width="1" opacity=".55"/></pattern>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="r"><rect width="1280" height="360" rx="18"/></clipPath>
</defs>
<style>
.flow{stroke-dasharray:6 10;animation:f 1.2s linear infinite}
@keyframes f{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 2.4s ease-in-out infinite}
@keyframes p{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.9)}}
.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.sweep{animation:sw 5s linear infinite}@keyframes sw{from{transform:translateX(-400px)}to{transform:translateX(1400px)}}
.rise{animation:r 1.2s ease-out both}@keyframes r{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.sans{font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
</style>
<g clip-path="url(#r)">
<rect width="1280" height="360" fill="url(#bg)"/><rect width="1280" height="360" fill="url(#grid)"/><rect width="1280" height="360" fill="url(#halo)"/>
<rect class="sweep" x="0" y="0" width="300" height="360" fill="url(#scan)"/>
<line x1="1050" y1="185" x2="875" y2="90" stroke="#2f6b4c" stroke-width="2"/>
<line class="flow" x1="1050" y1="185" x2="875" y2="90" stroke="#3ddc84" stroke-width="2.4" style="animation-delay:-0.0s" filter="url(#glow2)"/>
