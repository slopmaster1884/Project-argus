<circle class="pulse" cx="1050" cy="185" r="62" fill="none" stroke="#7dffb6" stroke-width="2.5"/><circle class="pulse" cx="1050" cy="185" r="62" fill="none" stroke="#7dffb6" stroke-width="2.5" style="animation-delay:-1.2s"/>
<rect x="992" y="155" width="116" height="60" rx="12" fill="#0f2a1e" stroke="#7dffb6" stroke-width="2" filter="url(#glow2)"/>
<text x="1050" y="183" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#eafff3" letter-spacing="2">GPU</text>
<text x="1050" y="201" text-anchor="middle" class="mono" font-size="10" fill="#7dffb6" letter-spacing="1">llama.cpp</text>
<g class="rise">
<circle cx="86" cy="108" r="9" fill="#3ddc84" filter="url(#glow2)"/>
<text x="108" y="114" class="mono" font-size="15" fill="#7dffb6" letter-spacing="4">LOCAL COMPUTE · v0.4</text>
<text x="76" y="200" class="sans" font-size="96" font-weight="800" letter-spacing="14" fill="url(#txt)" filter="url(#glow)">ARGUS</text>
<text x="80" y="246" class="sans" font-size="24" fill="#d9efe2">Your GPU plus the old phones in your drawer, as one LLM</text>
<text x="80" y="278" class="sans" font-size="18" fill="#8fb8a2">Offline. No subscriptions. No root.</text>
