# Argus Node — настройки ноды / node settings
#
# Этот файл лежит на SD-карте (диск «bootfs»). Его можно править в Блокноте на любом ПК.
# Убери «#» в начале нужной строки, впиши значение, сохрани, верни карту в Raspberry Pi.
# Edit on any PC (the "bootfs" drive): remove the "#" in front of a line, save, put the card back.
#
# Защищённый режим: к ноде подключаются только ПК, введшие PIN. PIN появится в файле
# argus-pin.txt рядом с этим файлом (вставь карту в ПК, чтобы его прочитать). Нужен Argus 0.3.5+.
# Secured mode: only PCs paired with the PIN may connect; the PIN is written to argus-pin.txt next to this file.
#ARGUS_SECURE=1
#
# Имя ноды в Argus (по умолчанию «Pi 5 · 3F2A»: модель + 4 последних знака MAC-адреса).
# Node name shown in Argus (default: model + last 4 hex digits of the MAC).
#ARGUS_NODE_NAME=Pi на кухне
#
# Сколько ядер процессора отдавать (по умолчанию все). / CPU threads (default: all cores).
#ARGUS_THREADS=4
#
# Порт (по умолчанию 50052). / TCP port (default 50052).
#ARGUS_PORT=50052
#
# IP главного ПК, если роутер не пропускает широковещание и нода не появляется в «Найдено в сети».
# IP of the main PC when the router blocks broadcast and the node never shows up in "Found on network".
#ARGUS_BEACON_TARGET=192.168.1.10
#
# Забыть всех сопряжённых ПК: создай рядом пустой файл argus-reset-token (он удалится сам).
# Unpair every PC: create an empty file named argus-reset-token next to this one (removed automatically).
